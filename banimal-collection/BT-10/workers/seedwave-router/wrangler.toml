name = "seedwave-router"
main = "index.js"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "*.seedwave.faa.zone/*", zone_name = "faa.zone" }
]

[env.production.vars]
ECOSYSTEM = "fruitful"
ENV = "production"

[[env.production.kv_namespaces]]
binding = "BRAND_CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
