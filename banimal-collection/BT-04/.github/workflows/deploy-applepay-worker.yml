name: Deploy Apple Pay Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/banimal-applepay-verify/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy banimal-applepay-verify to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/banimal-applepay-verify
