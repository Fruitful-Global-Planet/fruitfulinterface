name: Deploy Banimal Router
on:
  push:
    paths:
      - 'workers/banimal-router/**'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Banimal Router to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/banimal-router
          # --keep-vars prevents wrangler from wiping the Environment Variables
          # (PAYSTACK_SECRET_KEY, CAPITECPAY_SECRET, BOBGO_API_KEY, RESEND_API_KEY,
          # etc.) that are set on the worker in the Cloudflare dashboard.
          command: deploy --keep-vars

      # Restore/refresh the worker's secrets from GitHub Actions secrets.
      # Each secret is only pushed if it is actually set, so a missing GitHub
      # secret is skipped rather than overwriting the live value with a blank.
      # Add the values under: repo Settings -> Secrets and variables -> Actions.
      - name: Sync worker secrets from GitHub secrets
        working-directory: workers/banimal-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          CAPITECPAY_SECRET: ${{ secrets.CAPITECPAY_SECRET }}
          BOBGO_API_KEY: ${{ secrets.BOBGO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          # GitHub rejects any repo/environment secret whose name starts with
          # "GITHUB_" (reserved), so the OAuth app's credentials have to live
          # under a differently-named secret here — GH_OAUTH_CLIENT_ID/SECRET
          # — even though the Worker itself still reads them as
          # env.GITHUB_CLIENT_ID / env.GITHUB_CLIENT_SECRET (see push_secret
          # below, and lib/oauth.js).
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
        run: |
          set -e
          # push_secret <source env var> [<target wrangler secret name>]
          # Target defaults to the source name; pass a second arg when the
          # GitHub Actions secret name and the Worker's env var name differ
          # (only true for the GitHub OAuth credentials, see above).
          push_secret () {
            local source="$1"
            local target="${2:-$1}"
            local value="${!source}"
            if [ -n "$value" ]; then
              echo "Pushing $target to worker..."
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$target"
            else
              echo "Skipping $target (no GitHub secret $source set)."
            fi
          }
          push_secret PAYSTACK_SECRET_KEY
          push_secret PAYSTACK_PUBLIC_KEY
          push_secret CAPITECPAY_SECRET
          push_secret BOBGO_API_KEY
          push_secret RESEND_API_KEY
          push_secret GOOGLE_CLIENT_ID
          push_secret GOOGLE_CLIENT_SECRET
          push_secret FACEBOOK_APP_ID
          push_secret FACEBOOK_APP_SECRET
          push_secret APPLE_CLIENT_ID
          push_secret APPLE_TEAM_ID
          push_secret APPLE_KEY_ID
          push_secret APPLE_PRIVATE_KEY
          push_secret GH_OAUTH_CLIENT_ID GITHUB_CLIENT_ID
          push_secret GH_OAUTH_CLIENT_SECRET GITHUB_CLIENT_SECRET
          push_secret MICROSOFT_CLIENT_ID
          push_secret MICROSOFT_CLIENT_SECRET
          push_secret TWITTER_CLIENT_ID
          push_secret TWITTER_CLIENT_SECRET
